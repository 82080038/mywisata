<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - MyWisata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .offline-card { max-width: 400px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .icon-circle { width: 80px; height: 80px; border-radius: 50%; background: #f8f9fa; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
    </style>
</head>
<body>
    <div class="card offline-card text-center p-5">
        <div class="icon-circle">
            <i class="fas fa-wifi fa-2x text-muted"></i>
        </div>
        <h3 class="mb-2">Anda Sedang Offline</h3>
        <p class="text-muted mb-4">Koneksi internet tidak tersedia. Beberapa halaman mungkin masih dapat diakses dari cache.</p>
        <div class="d-grid gap-2">
            <a href="/mywisata/" class="btn btn-primary">
                <i class="fas fa-home me-1"></i>Kembali ke Beranda
            </a>
            <button onclick="location.reload()" class="btn btn-outline-primary">
                <i class="fas fa-redo me-1"></i>Coba Lagi
            </button>
        </div>
        <hr class="my-4">
        <div class="text-start">
            <h6 class="text-muted">Halaman tersimpan offline:</h6>
            <ul class="list-unstyled small text-muted">
                <li><i class="fas fa-check text-success me-1"></i>Beranda</li>
                <li><i class="fas fa-check text-success me-1"></i>Destinasi Wisata</li>
                <li><i class="fas fa-check text-success me-1"></i>Penginapan</li>
                <li><i class="fas fa-check text-success me-1"></i>Restoran</li>
                <li><i class="fas fa-check text-success me-1"></i>Event</li>
                <li><i class="fas fa-check text-success me-1"></i>Desa Wisata</li>
                <li><i class="fas fa-check text-success me-1"></i>Paket Wisata</li>
            </ul>
        </div>
    </div>
</body>
</html>
