name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.1', '8.2']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, pdo, pdo_mysql, json, curl, gd
        coverage: xdebug
    
    - name: Validate composer.json
      run: composer validate --no-check-all --strict
    
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    
    - name: Cache composer dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest
    
    - name: Run PHP CS Fixer
      run: |
        composer require --dev friendsofphp/php-cs-fixer
        vendor/bin/php-cs-fixer fix --dry-run --diff
    
    - name: Run PHPStan
      run: |
        composer require --dev phpstan/phpstan
        vendor/bin/phpstan analyse app --level=5
    
    - name: Setup MySQL
      run: |
        sudo systemctl start mysql
        mysql -e 'CREATE DATABASE IF NOT EXISTS mywisata_test;' -uroot -proot
        mysql -e 'CREATE USER IF NOT EXISTS "test_user"@"localhost" IDENTIFIED BY "test_pass";' -uroot -proot
        mysql -e 'GRANT ALL PRIVILEGES ON mywisata_test.* TO "test_user"@"localhost";' -uroot -proot
        mysql -e 'FLUSH PRIVILEGES;' -uroot -proot
    
    - name: Run database migrations
      run: |
        mysql mywisata_test < database/migration.sql -utest_user -ptest_pass
      env:
        DB_HOST: localhost
        DB_NAME: mywisata_test
        DB_USER: test_user
        DB_PASS: test_pass
    
    - name: Run PHPUnit tests
      run: vendor/bin/phpunit --configuration phpunit.xml
      env:
        DB_HOST: localhost
        DB_NAME: mywisata_test
        DB_USER: test_user
        DB_PASS: test_pass
    
    - name: Run Playwright tests
      run: |
        npm install
        npx playwright install --with-deps
        npx playwright test
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-php-${{ matrix.php-version }}
        path: test-results/
    
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: playwright-report/

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run PHP Security Checker
      run: |
        composer require --dev enlightn/security-checker
        vendor/bin/security-checker security:check
    
    - name: Run Snyk security scan
      uses: snyk/actions/php@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  deploy-staging:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to staging
      uses: easingthemes/ssh-deploy@v4
      with:
        SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.STAGING_HOST }}
        REMOTE_USER: ${{ secrets.STAGING_USER }}
        TARGET: ${{ secrets.STAGING_PATH }}
        SOURCE: '/'
        EXCLUDE: '/.git/, /node_modules/, /vendor/, /tests/, /docs/'
    
    - name: Run post-deploy commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd ${{ secrets.STAGING_PATH }}
          composer install --no-dev --optimize-autoloader
          php artisan migrate --force
          php artisan cache:clear
          php artisan config:clear

  deploy-production:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to production
      uses: easingthemes/ssh-deploy@v4
      with:
        SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.PRODUCTION_HOST }}
        REMOTE_USER: ${{ secrets.PRODUCTION_USER }}
        TARGET: ${{ secrets.PRODUCTION_PATH }}
        SOURCE: '/'
        EXCLUDE: '/.git/, /node_modules/, /vendor/, /tests/, /docs/'
    
    - name: Run post-deploy commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          cd ${{ secrets.PRODUCTION_PATH }}
          composer install --no-dev --optimize-autoloader
          php artisan migrate --force
          php artisan cache:clear
          php artisan config:clear
          php artisan queue:restart
    
    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Production deployment completed'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()
